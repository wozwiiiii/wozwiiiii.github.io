lang:                  zh-CN
title:                 wozwiiiii
copyright:             © 2026. All rights reserved.

accent_image:          /assets/img/sidebar-bg.jpg
accent_color:          rgb(79,177,186)
theme_color:           rgb(25,55,71)

google_fonts:          false

# 站点级配置
url:                   https://wozwiiiii.github.io
baseurl:               ""
description:           中南林业科技大学通信工程在读，AI应用与Agent开发方向。

# 插件
plugins:               [jekyll-include-cache, jekyll-paginate, jekyll-seo-tag, jekyll-feed, jekyll-avatar, jekyll-optional-front-matter, jekyll-readme-index, jekyll-relative-links, jekyll-titles-from-headings]

# 博客分页
paginate:              5
paginate_path:         /blog/page:num/

# 作者信息
author:
  name:                努力的小橙
  email:               2024771609@qq.com
  social:
    github:            wozwiiiii

# 侧边栏导航菜单
menu:
  - title:             首页
    url:               /
  - title:             博客
    url:               /blog/
  - title:             项目
    url:               /projects/
  - title:             关于
    url:               /about/

# 侧边栏底部链接
sidebar:
  - title:             GitHub
    url:               https://github.com/wozwiiiii

# 默认布局
defaults:
  - scope:
      path:            "_posts"
      type:            posts
    values:
      layout:          post
      author:          wozwiiiii

hydejack:
  post_addons:         [about, newsletter, related, random, comments]
  project_addons:      [about, newsletter, other, comments]

  no_mark_external:    false
  no_push_state:       false
  no_drawer:           false
  no_navbar:           false
  no_search:           false
  no_inline_css:       false
  no_page_style:       false
  no_break_layout:     true
  no_toc:              false
  no_third_column:     false
  no_large_headings:   false
  no_structured_data:  false
  no_theme_color:      false
  no_breadcrumbs:      false

  use_lsi:             true
  cookies_banner:      true
  advertise:           true
  hide_dates:          false
  hide_last_modified:  false

  dark_mode:
    always:            false
    dynamic:           true
    sunrise:           6
    sunset:            18
    icon:              true

  offline:
    enabled:           false
    cache_version:     1
    precache_assets:
      - /assets/img/swipe.svg

optional_front_matter:
  remove_originals:    true

readme_index:
  remove_originals:    true
  with_frontmatter:    true

relative_links:
  collections:         true

titles_from_headings:
  enabled:             false
  strip_title:         true
  collections:         true

compress_html:
  comments:            ["<!-- ", " -->"]
  clippings:           all
  endings:             all
  ignore:
    envs:              [development]

sass:
  style:               compressed
